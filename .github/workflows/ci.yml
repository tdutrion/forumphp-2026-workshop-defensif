# Quality gates of every pull request and of main: the same Docker stack and Makefile targets as
# on a developer machine (make lint, cs-check, phpstan, test).
# Actions are pinned to a commit: a moved tag can never change what runs here.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Start the PHP container and the database
        # The entrypoint installs the Composer dependencies and runs the migrations.
        run: docker compose up --build --wait php

      - name: Lint (composer.json, audit, container, Twig, YAML)
        run: make lint

      - name: Code style (php-cs-fixer, @Symfony)
        run: make cs-check

      - name: Static analysis (PHPStan)
        run: make phpstan

      - name: Tests (PHPUnit)
        run: make test

      - name: Logs of the containers
        if: failure()
        run: docker compose logs --no-color
