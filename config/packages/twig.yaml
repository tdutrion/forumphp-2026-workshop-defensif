twig:
    file_name_pattern: '*.twig'
    # Intentional v1 style (spec §8): arrays passed to templates, no strict variables.
    strict_variables: false
    form_themes: ['form/theme.html.twig']
    globals:
        # AGPL-3.0: every page links to the source code of this instance (SOURCE_CODE_URL).
        source_code_url: '%env(SOURCE_CODE_URL)%'
