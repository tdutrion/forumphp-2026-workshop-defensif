# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # English is the main language; French is served to browsers that ask for it.
    default_locale: en
    enabled_locales: ['en', 'fr']
    set_locale_from_accept_language: true
    set_content_language_from_locale: true

    http_client:
        scoped_clients:
            # Transport settings only: the SDK builds its URLs and headers itself.
            pathe.http_client:
                scope: '^https://www\.pathe\.fr/'
                timeout: 10
            wikidata.http_client:
                scope: '^https://www\.wikidata\.org/'
                timeout: 10
    cache:
        pools:
            # Pathé reference data (cities, cinemas, films), kept PATHE_CACHE_TTL seconds.
            cache.pathe:
                adapter: cache.app
            # Last bookable time of each day, computed by the import (CatalogCalendar). Refreshed by
            # the worker and read by the web server: in MySQL (table cache_items), shared by both
            # containers, whereas cache.app lives in the var/ directory of each container.
            cache.catalog:
                adapter: cache.adapter.doctrine_dbal
            # Wikidata answers (works), kept a day.
            cache.wikidata:
                adapter: cache.app

    # Note that the session will be started ONLY if you read or write from it.
    session: true

    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        cache:
            pools:
                # One empty calendar per test kernel.
                cache.catalog:
                    adapter: cache.adapter.array
                cache.wikidata:
                    adapter: cache.adapter.array
        session:
            storage_factory_id: session.storage.factory.mock_file
