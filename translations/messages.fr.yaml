'landing.hero.text': 'Choisissez un jour, une ville et le nombre de films : ScreenRoute compose des programmes où chaque séance s''enchaîne avec la suivante, trajet entre cinémas compris.'
'landing.hero.title': 'Enchaînez les films sans perdre une minute'
'landing.how.book.text': 'Chaque séance mène directement à sa page de réservation sur le site du cinéma.'
'landing.how.book.title': 'Réservez au cinéma'
'landing.how.chain.text': 'Les séances s''enchaînent avec une marge de sécurité et le temps de trajet de votre choix : à pied, à vélo, en transports en commun ou en voiture.'
'landing.how.chain.title': 'Recevez des programmes qui tiennent'
'landing.how.describe.text': 'Une date, une plage horaire, une ville ou votre position, de 1 à 8 films, et la version que vous préférez.'
