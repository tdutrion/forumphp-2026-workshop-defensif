'landing.features.travel.title': 'De vrais temps de trajet'
'landing.features.version.text': 'La bonne version, y compris les films tournés dans la langue du pays quand vous demandez la VO.'
'landing.features.version.title': 'VO, VOST ou VF'
'landing.final.text': 'Connectez-vous avec le compte que vous avez déjà, et planifiez votre première journée en une minute.'
'landing.final.title': 'Prêt pour votre prochain marathon ?'
'landing.free.privacy': 'Lire la politique de confidentialité'
'landing.free.text': 'Ni publicité, ni pistage. Les options payantes ne servent qu’à payer l’infrastructure qu’elles demandent. ScreenRoute ne garde que ce qu’il faut pour planifier vos journées.'
'landing.free.title': 'Gratuit, et honnête'
