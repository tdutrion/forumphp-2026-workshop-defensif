'landing.chains.planned': 'Pas encore pris en charge'
'landing.chains.supported': 'Disponible'
'landing.chains.text': 'ScreenRoute est pensé pour les chaînes de cinéma qui proposent un abonnement illimité. Seul Pathé est pris en charge pour le moment : les autres suivront, une à une.'
'landing.chains.title': 'Tous les abonnements illimités, bientôt'
'landing.coverage': 'Tous les cinémas de la chaîne dans le pays, mis à jour plusieurs fois par jour.'
'landing.cta.self_host': 'L''héberger moi-même'
'landing.cta.start': 'Planifier mon marathon'
'landing.faq.cinemas.answer': 'Tous les cinémas des chaînes prises en charge. Les autres chaînes avec abonnement illimité (UGC, Cineworld, Kinepolis…) sont prévues. Une instance auto-hébergée choisit ses propres villes.'
'landing.faq.cinemas.question': 'Quels cinémas sont couverts ?'
'landing.faq.data.answer': 'Seul ce dont le planificateur a besoin est conservé : votre compte, vos préférences et les films que vous avez marqués. Rien n''est vendu ni partagé à des fins publicitaires.'
'landing.faq.data.question': 'Que deviennent mes données ?'
'landing.faq.free.answer': 'Oui : la planification est gratuite et le restera, sans publicité. Des options payantes (recommandations, temps de trajet précis) viendront plus tard, uniquement pour payer l’infrastructure qu’elles demandent ; une instance auto-hébergée les obtient en fournissant son propre serveur de base de données et sa clé d’API Google Maps.'
'landing.faq.free.question': 'Est-ce vraiment gratuit ?'
'landing.faq.pathe.answer': 'Non : c''est un service indépendant. Il lit les horaires publiés par les cinémas, et vous réservez vos places sur leur site.'
'landing.faq.pathe.question': 'ScreenRoute est-il édité par une chaîne de cinéma ?'
'landing.faq.title': 'Questions'
'landing.features.api.text': 'Les mêmes programmes en JSON, avec des jetons personnels, pour vos propres outils.'
'landing.features.api.title': 'Une API'
