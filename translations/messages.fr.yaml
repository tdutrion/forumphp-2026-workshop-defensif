'landing.paid.not_available': 'Pas encore disponible'
'landing.paid.recommendations.text': 'Des films choisis pour vous par une IA qui s’appuie sur une base de données orientée graphe des films, des équipes et des goûts : votre prochain marathon, déjà trouvé.'
'landing.paid.recommendations.title': 'Recommandations de films'
'landing.paid.text': 'La planification reste gratuite. Ces options demandent une infrastructure qui a un coût : un serveur de base de données orientée graphe et des appels à l’API Google Maps ; leur prix sert à la payer. Aucune n’est encore disponible.'
'landing.paid.title': 'Bientôt, en option payante'
'landing.paid.travel.text': 'Des temps de trajet entre cinémas calculés avec l’API Google Maps, d’après les vrais itinéraires et le trafic plutôt qu’à vol d’oiseau.'
